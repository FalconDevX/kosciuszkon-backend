services:
  backend:
    build:
      context: .
    container_name: kosciuszkon-backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    # RAG na hoście :8080 — z kontenera NIE używaj localhost (to sam kontener).
    # Ustaw w .env: RAG_SERVICE_URL=http://host.docker.internal:8080
    environment:
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
